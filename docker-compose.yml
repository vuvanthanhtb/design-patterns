# Production:   docker compose up -d --build        → http://localhost:3000
# Development:  docker compose --profile dev up dev  → http://localhost:3001 (hot reload)

name: design-patterns

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Đặt domain thật khi deploy: SITE_URL=https://example.com docker compose up -d --build
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: design-patterns:latest
    container_name: design-patterns
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    # Hardening: hệ thống file chỉ đọc, bỏ mọi capability, không leo quyền
    read_only: true
    tmpfs:
      - /tmp
      # Next.js ghi cache lúc chạy vào hai thư mục này
      - /app/.next/cache:uid=1001,gid=1001
      - /app/.next/server/route-cache:uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Môi trường dev tuỳ chọn (Next.js khuyên chạy `npm run dev` trực tiếp trên Mac/Windows
  # để nhanh hơn; dùng service này khi không muốn cài Node trên máy).
  dev:
    profiles: ["dev"]
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "${DEV_PORT:-3001}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next

volumes:
  dev_node_modules:
  dev_next:
